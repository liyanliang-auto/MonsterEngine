name: Android build and package inspection
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Build signed release AAB using protected environment secrets
        type: boolean
        default: false
  pull_request:
    paths: ['android/**', 'Include/**', 'Source/**', 'Shaders/**', 'cmake/**', 'Tools/Android/**', 'CMakeLists.txt', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    environment: android-build
    timeout-minutes: 90
    env:
      VULKAN_SDK_VERSION: '1.3.296.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;30.0.16248370' 'cmake;3.22.1'
      - name: Install checksum-approved host shader tools
        shell: bash
        env:
          SDK_SHA256: ${{ vars.VULKAN_SDK_LINUX_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$SDK_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Configure approved VULKAN_SDK_LINUX_SHA256 for pinned LunarG archive'; exit 1; }
          archive="$RUNNER_TEMP/vulkan-sdk.tar.xz"
          curl --fail --location --retry 3 "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" --output "$archive"
          printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/vulkan-sdk"
          tar -xJf "$archive" -C "$RUNNER_TEMP/vulkan-sdk"
          tools="$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin"
          test -x "$tools/glslc" && test -x "$tools/spirv-val"
          echo "SPLAT_GLSLC=$tools/glslc" >> "$GITHUB_ENV"
          echo "SPLAT_SPIRV_VAL=$tools/spirv-val" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/lib" >> "$GITHUB_ENV"
      - name: Build two-ABI debug APK
        if: ${{ !inputs.release_bundle }}
        shell: pwsh
        run: |
          $env:Python3_EXECUTABLE = (Get-Command python).Source
          chmod +x android/gradlew
          ./Tools/Android/build_android.ps1 -Variant Debug
      - name: Materialize externally supplied release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_bundle }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MONSTER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monster-release.keystore"
          chmod 600 "$RUNNER_TEMP/monster-release.keystore"
      - name: Build two-ABI signed AAB without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_bundle }}
        shell: pwsh
        env:
          MONSTER_KEYSTORE_PASSWORD: ${{ secrets.MONSTER_KEYSTORE_PASSWORD }}
          MONSTER_KEY_ALIAS: ${{ secrets.MONSTER_KEY_ALIAS }}
          MONSTER_KEY_PASSWORD: ${{ secrets.MONSTER_KEY_PASSWORD }}
        run: |
          $env:MONSTER_KEYSTORE = Join-Path $env:RUNNER_TEMP 'monster-release.keystore'
          $env:Python3_EXECUTABLE = (Get-Command python).Source
          chmod +x android/gradlew
          ./Tools/Android/build_android.ps1 -Variant Release -Bundle -RequireSigning -VersionCode ([int]$env:GITHUB_RUN_NUMBER)
      - name: Delete temporary signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/monster-release.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
            android/build/reports/delivery/*.json
          if-no-files-found: warn
          retention-days: 14
